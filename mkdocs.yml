site_name: Jason 的个人知识库
site_description: 汽车电子、嵌入式开发和信息安全知识整理

site_url: https://jason88619.github.io/Knowledge/

repo_url: https://github.com/jason88619/Knowledge
repo_name: jason88619/Knowledge

edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  features:
    # - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式

    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - 首页: index.md
  - 基础知识: 01-fundamentals/index.md
  - 技术栈: 02-tech-stack/index.md
  - 项目实战: 03-projects/index.md
  - 芯片平台: 04-chip-platforms/index.md
  - 问题记录: 05-issue-log/index.md
