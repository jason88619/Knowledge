site_name: Jason 的个人知识库
site_description: 汽车电子、嵌入式开发和信息安全知识整理

site_url: https://jason88619.github.io/Knowledge/

repo_url: https://github.com/jason88619/Knowledge
repo_name: jason88619/Knowledge

edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  features:
    # - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式

    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - 首页: index.md

  - 基础知识:
        - C语言: 01-fundamentals/C/index.md
        - C++语言: 01-fundamentals/Cpp/index.md
        - ARM: 01-fundamentals/ARM/index.md
        - RTOS: 01-fundamentals/RTOS/index.md
  - 技术栈: 
        - UDS: 02-tech-stack/UDS/index.md
        - Bootloader: 02-tech-stack/Bootloader/index.md
        - OTA: 02-tech-stack/OTA/index.md
        - CAN: 02-tech-stack/CAN/index.md
        - AUTOSAR: 02-tech-stack/AUTOSAR/index.md
  - 芯片平台:
        - Infineon: 03-chip-platforms/Infineon/index.md
        - NXP-S32K: 03-chip-platforms/NXP-S32K/index.md
        - STM32: 03-chip-platforms/STM32/index.md
  - 项目实战: 04-projects/index.md
  - 问题记录: 05-issue-log/index.md
